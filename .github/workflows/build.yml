
name: DocsIND Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build DocsIND APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Check Flutter
      - name: Check Flutter
        run: flutter --version

      # 5. Check Project
      - name: Check Flutter Project
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "pubspec.yaml not found!"
            exit 1
          fi

          if [ ! -d android ]; then
            flutter create --platforms=android --project-name docsind .
          fi

      # 6. Install Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 7. Generate App Icon
      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      # 8. Generate Splash Screen
      - name: Generate Splash Screen
        run: dart run flutter_native_splash:create

      # 9. Build Release APK
      - name: Build Release APK
        run: flutter build apk --release

      # 10. Check APK
      - name: Check APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      # 11. Upload APK
      - name: Upload DocsIND APK
        uses: actions/upload-artifact@v4
        with:
          name: DocsIND-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
