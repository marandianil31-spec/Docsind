
name: DocuMaster Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build DocuMaster APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Create Flutter project if missing
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create --project-name documaster --org com.documaster .
          fi

      - name: Repair Android project if needed
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android .
          fi

          if [ ! -f android/gradlew ]; then
            echo "ERROR: Android Gradle Wrapper is missing"
            exit 1
          fi

      - name: Save generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Repair Android project files"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Gradle Lint workaround
        run: |
          mkdir -p "$HOME/.gradle/init.d"

          cat > "$HOME/.gradle/init.d/disable-image-picker-lint.gradle" <<'EOF'
          gradle.projectsEvaluated {
              gradle.rootProject.allprojects { p ->
                  if (p.name == "image_picker_android") {
                      p.tasks.matching {
                          it.name == "lintVitalAnalyzeRelease" ||
                          it.name == "lintAnalyzeRelease"
                      }.configureEach {
                          enabled = false
                      }
                  }
              }
          }
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Check APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DocuMaster-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
