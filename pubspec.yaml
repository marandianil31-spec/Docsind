name: documaster
description: DocuMaster PDF and Document Toolkit
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Image to PDF
  image_picker: ^1.2.4
  pdf: ^3.12.0
  path_provider: ^2.1.6

  # Share PDF
  share_plus: ^12.0.2
  cross_file: ^0.3.5

  # PDF Merge
  file_picker: ^10.3.7
  syncfusion_flutter_pdf: ^32.1.24

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  archive: 4.0.8
  
